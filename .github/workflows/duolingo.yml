name: Duolingo Practice XP Farm
permissions:
  contents: read

# GitHub cron hay bị trễ vài tiếng hoặc bỏ qua hẳn, nên trigger mỗi 2 tiếng.
# Job `gate` gửi 1 request nhỏ qua chuỗi AI provider (xem ai_providers.py): chỉ khi còn
# provider đọc được ảnh và còn hạn mức thì mới chạy job farm. Hạn mức theo ngày reset
# lúc 00:00 UTC (= 07:00 giờ VN) nên sau mốc đó gate tự mở lại.
# Script farm tự dừng khi mọi provider hết hạn mức, timeout chỉ là mức chặn trên.
on:
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch:

concurrency:
  group: duolingo-practice-farm
  cancel-in-progress: false

jobs:
  gate:
    name: Check AI quota
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install python-dotenv openai

      - id: check
        name: Is any AI provider still available?
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Tên provider (prefix, cách nhau bằng dấu phẩy) không tính vào việc mở gate, vd: "mistral,zai"
          GATE_IGNORE: ''
        run: |
          # exit 0 = còn quota, 3 = hết quota (bỏ qua farm), khác = lỗi thật (làm job fail để thấy)
          rc=0
          python check_quota.py || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 3 ]; then
            echo "No AI provider has quota left, skipping the farm."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "check_quota.py failed with exit code $rc"
            exit "$rc"
          fi

  practice-farm:
    name: Practice XP Farm (EN for VI)
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install python-dotenv playwright openai
          playwright install chromium
          playwright install-deps chromium

      - name: Run practice farm
        env:
          VI_DUO_EMAIL: ${{ secrets.VI_DUO_EMAIL }}
          VI_DUO_PASSWORD: ${{ secrets.VI_DUO_PASSWORD }}
          VI_DUO_JWT: ${{ secrets.VI_DUO_JWT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEADLESS: 'true'
        run: python duolingo_practice_farm.py

      - name: Save artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: practice-debug-${{ github.run_number }}
          path: |
            vi_duo_session.json
            stuck_debug.png
            playwright-videos/
          retention-days: 3
          if-no-files-found: ignore
